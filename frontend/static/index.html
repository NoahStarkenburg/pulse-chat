<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pulse Chat</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.2rem; display: flex; align-items: center; gap: .6rem; }
  .row { display: flex; gap: .5rem; margin-bottom: .75rem; flex-wrap: wrap; align-items: center; }
  input { padding: .4rem .5rem; }
  #status { font-size: .8rem; padding: .15rem .5rem; border-radius: .4rem; }
  .s-closed     { background: #fde2e2; color: #8a1f1f; }
  .s-open       { background: #e2f7e6; color: #1f7a33; }
  .s-connecting { background: #fff4d6; color: #8a6d1f; }
  #who { font-size: .85rem; color: #666; }
  #log { border: 1px solid #8884; border-radius: .5rem; height: 320px; overflow-y: auto; padding: .5rem; margin: .75rem 0; }
  .msg { margin: .25rem 0; }
  .msg .who { font-weight: 600; }
  .msg .when { color: #8888; font-size: .72rem; margin-left: .4rem; }
  .sys { color: #8888; font-style: italic; }
  #composer { display: flex; gap: .5rem; }
  #composer input { flex: 1; padding: .5rem; }
  button { padding: .5rem .8rem; cursor: pointer; }
</style>
</head>
<body>
  <h1>Pulse Chat <span id="status" class="s-closed">disconnected</span></h1>

  <div class="row">
    <input id="username" placeholder="username" autocomplete="username" />
    <input id="password" type="password" placeholder="password" autocomplete="current-password" />
    <button id="signup">Sign up</button>
    <button id="login">Log in</button>
    <button id="logout" disabled>Log out</button>
    <span id="who"></span>
  </div>

  <div class="row">
    <input id="room" placeholder="room" value="general" />
    <button id="connect" disabled>Connect</button>
  </div>

  <div id="log" aria-live="polite"></div>

  <form id="composer">
    <input id="text" placeholder="Type a message..." autocomplete="off" disabled />
    <button id="send" disabled>Send</button>
  </form>

<script>
// Pulse Chat client. Vanilla JS, no framework. Auth is cookie-based: signup or
// login sets an HttpOnly session cookie, which the browser then sends on every
// request including the WebSocket upgrade. The chat wire protocol matches
// internal/chat/message.go; the server stamps id/sender/timestamp.

let socket = null;
const $ = (id) => document.getElementById(id);
const logEl = $("log");

function setStatus(state, text) {
  const el = $("status");
  el.className = "s-" + state; // s-open | s-closed | s-connecting
  el.textContent = text;
}

function addMessage({ who, text, when, system }) {
  const div = document.createElement("div");
  if (system) {
    div.className = "msg sys";
    div.textContent = text;
  } else {
    div.className = "msg";
    const when_str = when ? new Date(when).toLocaleTimeString() : "";
    // Build with textContent, never innerHTML, so user input cannot inject HTML.
    const who_el = document.createElement("span");
    who_el.className = "who";
    who_el.textContent = who;
    const body_el = document.createElement("span");
    body_el.textContent = ": " + text;
    const when_el = document.createElement("span");
    when_el.className = "when";
    when_el.textContent = when_str;
    div.append(who_el, body_el, when_el);
  }
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

// --- Auth -----------------------------------------------------------------

function setLoggedIn(user) {
  $("who").textContent = "logged in as " + user.username;
  $("logout").disabled = false;
  $("connect").disabled = false;
  $("signup").disabled = true;
  $("login").disabled = true;
}

function setLoggedOut() {
  if (socket) { socket.close(); socket = null; }
  $("who").textContent = "";
  $("logout").disabled = true;
  $("connect").disabled = true;
  $("signup").disabled = false;
  $("login").disabled = false;
  $("text").disabled = true;
  $("send").disabled = true;
}

async function authenticate(path) {
  const username = $("username").value.trim();
  const password = $("password").value;
  if (!username || !password) { alert("username and password are required"); return; }
  try {
    const resp = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin", // send and store the session cookie
      body: JSON.stringify({ username, password }),
    });
    if (!resp.ok) {
      const msg = await resp.text();
      alert(`${path} failed (${resp.status}): ${msg.trim()}`);
      return;
    }
    const user = await resp.json();
    setLoggedIn(user);
    $("password").value = "";
  } catch (err) {
    alert("request failed: " + err);
  }
}

async function logout() {
  try { await fetch("/logout", { method: "POST", credentials: "same-origin" }); } catch {}
  setLoggedOut();
  setStatus("closed", "disconnected");
}

// On load, restore the session if the cookie is still valid. If the URL names a
// room, reconnect to it automatically so a refresh rejoins where you were.
async function restoreSession() {
  try {
    const resp = await fetch("/me", { credentials: "same-origin" });
    if (!resp.ok) return;
    setLoggedIn(await resp.json());
    if (new URLSearchParams(location.search).get("room")) connect();
  } catch {}
}

// --- Chat -----------------------------------------------------------------

function connect() {
  const room = $("room").value.trim();
  if (!room) { alert("room is required"); return; }

  // Reflect the room in the URL so a refresh remembers it and can reconnect.
  const params = new URLSearchParams(location.search);
  params.set("room", room);
  history.replaceState(null, "", "?" + params.toString());

  // Same origin as the page; the session cookie is sent on the upgrade.
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const url = `${scheme}://${location.host}/ws?room=${encodeURIComponent(room)}`;

  setStatus("connecting", "connecting...");
  socket = new WebSocket(url);

  socket.onopen = () => {
    setStatus("open", `connected to #${room}`);
    $("text").disabled = false;
    $("send").disabled = false;
    $("text").focus();
    addMessage({ system: true, text: `joined #${room}` });
  };

  socket.onmessage = (event) => {
    let env;
    try { env = JSON.parse(event.data); } catch { return; }
    if (env.type === "message") {
      addMessage({ who: env.sender, text: env.text, when: env.timestamp });
    } else if (env.type === "system") {
      addMessage({ system: true, text: env.text });
    } else if (env.type === "error") {
      addMessage({ system: true, text: "error: " + env.text });
    }
  };

  socket.onclose = (event) => {
    setStatus("closed", "disconnected");
    $("text").disabled = true;
    $("send").disabled = true;
    addMessage({ system: true, text: `disconnected (code ${event.code})` });
  };

  socket.onerror = () => addMessage({ system: true, text: "connection error" });
}

function send(text) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  const room = $("room").value.trim();
  socket.send(JSON.stringify({ type: "chat", room, text }));
}

$("signup").addEventListener("click", () => authenticate("/signup"));
$("login").addEventListener("click", () => authenticate("/login"));
$("logout").addEventListener("click", logout);
$("connect").addEventListener("click", connect);
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("text");
  const text = input.value.trim();
  if (!text) return;
  send(text);
  input.value = "";
  input.focus();
});

// Seed the room input from the URL so a refresh keeps your room visible even
// before the session check completes.
const urlRoom = new URLSearchParams(location.search).get("room");
if (urlRoom) $("room").value = urlRoom;
restoreSession();
</script>
</body>
</html>

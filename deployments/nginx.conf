# Load balancer for the Phase 3 two-instance demo. It proxies WebSocket and HTTP
# traffic to two server instances; Redis Pub/Sub carries messages between
# whichever instances the load balancer happens to pick, so users on different
# instances still chat together.
#
# Run two instances (each needs PULSE_POSTGRES_URL and PULSE_REDIS_URL set):
#   PULSE_SERVER_ADDR=:8080 go run ./cmd/server
#   PULSE_SERVER_ADDR=:8081 go run ./cmd/server
#
# Then put this in front of them and open http://localhost:8000 in two tabs:
#   docker run --rm -p 8000:8000 \
#     -v "$PWD/deployments/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine

events {}

http {
    upstream pulse_backends {
        # least_conn spreads new connections across the instances, which suits
        # long-lived WebSocket connections better than round-robin.
        least_conn;
        server host.docker.internal:8080;
        server host.docker.internal:8081;
    }

    # A WebSocket starts as an HTTP request asking to upgrade. This map lets the
    # proxy pass the Upgrade/Connection headers through so the handshake
    # completes instead of being treated as a normal, short request.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://pulse_backends;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSockets are long-lived; do not let the proxy time them out.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}

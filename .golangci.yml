# golangci-lint configuration for Pulse Chat.
#
# Philosophy: strict enough to catch real bugs and shape good habits,
# pragmatic enough to not block learning. Lint findings should teach
# you something — when one fires, read the underlying rule before silencing.
#
# Run locally:    golangci-lint run
# Auto-fix some:  golangci-lint run --fix

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    # --- Correctness (always on) -----------------------------------------
    - errcheck       # Catch unchecked errors. The #1 source of silent bugs in Go.
    - govet          # Suspicious constructs (printf args, shadowing, locking).
    - ineffassign    # Detects assignments whose value is never read.
    - staticcheck    # Massive correctness bundle. Pays for itself daily.
    - unused         # Unused variables, functions, types, fields.
    - typecheck      # Type-checks the code (mandatory; explicit here).

    # --- Style (enforce conventions) -------------------------------------
    # NOTE: gofmt + gofumpt are temporarily disabled until Phase 1 starts.
    # The scaffold uses 3-space indents in doc-comment lists; Go 1.19+'s
    # gofmt wants 2-space. Once Go is installed locally, run `gofmt -w .`
    # to normalize and re-enable both linters here.
    # - gofmt
    # - gofumpt
    - goimports      # Import grouping/ordering (the part that matters most).
    - misspell       # English spelling in comments and strings.
    - revive         # Style + naming + complexity. Replaces golint.

    # --- Hardening / discipline ------------------------------------------
    - bodyclose      # Catches unclosed HTTP response bodies (resource leak).
    - errorlint      # Catches incorrect error-wrapping (%w vs %v).
    - gocheckcompilerdirectives # //go:build correctness.
    - copyloopvar    # Loop-variable scoping (Go 1.22+).
    - contextcheck   # Verify context.Context is passed correctly.
    - durationcheck  # Catches silly time.Duration arithmetic mistakes.
    - exhaustive     # Switch-on-enum exhaustiveness.
    - forbidigo      # Forbid specific function calls (see config below).
    - nilerr         # Catches `return nil` when `err != nil`.
    - noctx          # HTTP requests without a Context.
    - rowserrcheck   # database/sql Rows.Err() handling.
    - sqlclosecheck  # database/sql Close() handling.
    - tparallel      # t.Parallel() correctness.
    - unconvert      # Unnecessary type conversions.
    - wastedassign   # Useless assignments.
    - whitespace     # Trailing newlines etc.

    # --- Security --------------------------------------------------------
    - gosec          # Security issues. Will fire on intentional things;
                     # silence with care.

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Tests routinely ignore errors from setup helpers; allow it there.
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - forbidigo

    # internal/chat/* contains scaffold methods (readPump, writePump, etc.)
    # that are intentionally not yet wired up — Phase 1 implements them.
    # Once Phase 1 lands and these are used, remove this exclude.
    - path: internal/chat/.*\.go
      linters:
        - unused

linters-settings:
  errcheck:
    exclude-functions:
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Fprint
      - (net/http.ResponseWriter).Write

  goimports:
    local-prefixes: github.com/NoahStarkenburg/pulse-chat

  revive:
    rules:
      - name: exported          # public symbols need doc comments
      - name: package-comments
      - name: var-naming
      - name: indent-error-flow
      - name: error-return
      - name: error-strings

  forbidigo:
    forbid:
      # Forbid fmt.Println in non-test code. Use slog.
      - p: '^fmt\.Println$'
        msg: "Use slog (structured logging), not fmt.Println."
      # Forbid panic() except via log.Fatal in main.
      - p: '^panic$'
        msg: "Return an error instead of panicking. (main.go may use log.Fatal.)"

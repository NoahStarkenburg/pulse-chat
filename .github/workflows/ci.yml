# CI for Pulse Chat.
#
# Runs on every push to main and every PR targeting main.
# Three independent jobs run in parallel: lint, test, build. Any one of them
# going red blocks the PR from merging.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new push arrives on the same branch.
# Saves CI minutes and avoids merging stale results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # Annotate PRs inline with lint issues.
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        # -race detects data races at test time. Always on in CI; the small
        # runtime overhead is irrelevant in a test environment.
        run: go test -race -timeout 5m ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all packages
        # `go build ./...` confirms every package compiles. The output is
        # discarded - we only care that the build succeeds.
        run: go build ./...
